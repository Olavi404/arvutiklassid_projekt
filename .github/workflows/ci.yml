name: CI

# Käivitub iga pull request'i ja main harusse tehtud push'i peale.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test-and-lint:
    name: Testid ja lint (app/)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Node.js seadistamine
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Sõltuvuste paigaldamine
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testid (node --test)
        run: npm test
